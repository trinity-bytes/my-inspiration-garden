<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover extends the canvas under Android's gesture bar.
         Without it Chrome keeps the viewport above that bar and paints the
         strip itself, which theme-color does not reach. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A personal space of resources, curated by me, for me." />
    <!-- The site also answers on its workers.dev host; this keeps search on one URL. -->
    <link rel="canonical" href="https://inspo.jahattrinidad.com/" />
    <!-- Link unfurlers read these without running the app, and do not resolve
         relative image URLs, so everything here is static and absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Inspiration Garden" />
    <meta property="og:title" content="Inspiration Garden" />
    <meta property="og:description" content="A personal space of resources, curated by me, for me." />
    <meta property="og:url" content="https://inspo.jahattrinidad.com/" />
    <meta property="og:image" content="https://inspo.jahattrinidad.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Inspiration Garden logo, name and tagline surrounded by sample resource cards." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inspiration Garden" />
    <meta name="twitter:description" content="A personal space of resources, curated by me, for me." />
    <meta name="twitter:image" content="https://inspo.jahattrinidad.com/og-image.png" />
    <meta name="theme-color" content="#1c1830" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installed on Android as a standalone app (no address bar). Chrome only
         offers "Install app" instead of a plain shortcut when this manifest is
         installable: name, 192px + 512px PNG icons, start_url, standalone
         display. A service worker is not part of the criteria. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS has no install prompt and, before iOS 16.4, ignores the manifest
         display entirely; Safari creates a home-screen web app only when these
         tags are present. The status bar stays "default": "black-translucent"
         would pull the page under the clock. iOS masks the icon itself, so
         apple-touch-icon is the full-bleed opaque variant. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Garden" />
    <title>Inspiration Garden</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
