<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Inspiration Garden mark, "Four cards": rounded cards in two staggered
    columns, the shape the canvas is made of, on the dark canvas color.
    Designed in Figma (Proposals page, frame F18, component
    App Icon/B Four cards).

    Hand-written and hardcoded on purpose. A favicon is fetched as its own
    resource, so it cannot see the page's CSS custom properties, and a `var()`
    reference to a design token here would resolve to nothing and paint
    black. Hex values mirror `src/styles/tokens.css`; keep the two in step.
    (XML forbids a double hyphen inside a comment, which is why that token is
    named rather than quoted.)

    Drawn on a 32px grid (2x a 16px tab) with only large, high-contrast
    shapes. The PNG icons are rasterized from this file; the maskable and
    apple-touch ones drop the tile radius, because the platform applies its
    own mask, and the maskable one also shrinks the cards into the safe zone.
  -->
  <title>Inspiration Garden</title>
  <rect width="32" height="32" rx="7" fill="#1C1830" />

  <!-- Light falls from above, so the lower cards are darker. -->
  <rect x="3.5" y="3.5" width="11.5" height="14" rx="1.5" fill="#E9E3F3" />
  <rect x="3.5" y="19.5" width="11.5" height="9" rx="1.5" fill="#B3A3D1" />
  <rect x="17" y="14.5" width="11.5" height="14" rx="1.5" fill="#D5CBE8" />

  <!-- The apricot card: the one accent, and the focal point. -->
  <rect x="17" y="3.5" width="11.5" height="9" rx="1.5" fill="#F29A6B" />
</svg>
